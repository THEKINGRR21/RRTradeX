name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: rrtradex }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rrtradex
      ADMIN_EMAIL: admin@ci.rrtradex.app
      ADMIN_PASSWORD: ci-Admin-password-123
      SEED_DEMO_USERS: "true"
      CRON_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build          # applies migrations + seed, then builds
      - name: End-to-end acceptance tests
        run: |
          npx next start -p 3000 &
          npx --yes wait-on http://localhost:3000/api/v1/health
          node tests/e2e.mjs
